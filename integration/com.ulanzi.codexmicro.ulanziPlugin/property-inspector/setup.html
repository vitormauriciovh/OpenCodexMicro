<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Micro Setup</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { margin: 0; background: transparent; color: #e8e8e8; font-size: 13px; }
    * { box-sizing: border-box; }
    main { padding: 12px 14px 10px; }
    h1 { margin: 0 0 5px; font-size: 15px; font-weight: 650; }
    .intro, .message, .notice, .info-body { line-height: 1.4; }
    .intro { margin: 0 0 10px; color: #aeb3ba; }
    .panel, .notice, details { border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: rgba(255,255,255,.035); }
    .panel { overflow: hidden; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; min-height: 37px; padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .row:last-child { border-bottom: 0; }
    .value { display: inline-flex; align-items: center; gap: 6px; color: #aeb3ba; text-align: right; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #72777f; }
    .value.good { color: #75d6a3; } .value.good .dot { background: #42c985; }
    .value.warn { color: #f0bc68; } .value.warn .dot { background: #e6a84b; }
    .value.bad { color: #ef8585; } .value.bad .dot { background: #e45f5f; }
    .notice { display: none; margin: 0 0 10px; padding: 9px 10px; color: #d8c38c; border-color: rgba(230,168,75,.35); background: rgba(230,168,75,.07); }
    .notice strong { display: block; margin-bottom: 4px; color: #efca7c; }
    .notice p { margin: 4px 0; }
    .notice ul { margin: 6px 0 0; padding-left: 18px; }
    .notice ol { margin: 7px 0 0; padding-left: 21px; }
    .notice li { margin: 4px 0; }
    .secure-guide { color: #d7dbe1; border-color: rgba(228,95,95,.38); background: rgba(228,95,95,.07); }
    .secure-guide strong { color: #f0a0a0; }
    .secure-warning { color: #efc16f; }
    .message { min-height: 18px; margin: 8px 1px 4px; color: #aeb3ba; }
    .message.error { color: #ef8585; } .message.success { color: #75d6a3; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    button { min-height: 33px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; color: #f3f3f3; background: rgba(255,255,255,.08); cursor: pointer; }
    button:hover:not(:disabled) { background: rgba(255,255,255,.13); }
    button.primary { border-color: #3f78bd; background: #2867ad; }
    button.danger { grid-column: 1 / -1; color: #ef9a9a; border-color: rgba(228,95,95,.35); background: rgba(228,95,95,.08); }
    button:disabled { cursor: default; opacity: .45; }
    details { margin-top: 10px; }
    summary { padding: 9px 10px; color: #d5d8dc; cursor: pointer; font-weight: 600; }
    .info-body { padding: 0 10px 10px; color: #9fa5ad; }
    .info-body p { margin: 6px 0; }
    .version { margin-top: 7px; color: #777e87; font-size: 11px; text-align: right; }
    .confirm-overlay { position: fixed; inset: 0; z-index: 1000; display: none; place-items: center; padding: 18px; background: rgba(8,10,13,.72); }
    .confirm-overlay.visible { display: grid; }
    .confirm-card { width: min(100%, 360px); padding: 14px; border: 1px solid rgba(255,255,255,.16); border-radius: 9px; background: #25282d; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
    .confirm-message { margin: 0; color: #eef0f3; line-height: 1.45; white-space: pre-wrap; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .confirm-actions button { min-width: 76px; padding: 0 12px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="intro" class="intro"></p>
    <section id="experimental" class="notice"><strong id="experimentalTitle"></strong><p id="experimentalDescription"></p></section>
    <section id="localTrust" class="notice">
      <strong id="localTrustTitle"></strong><p id="localTrustDescription"></p>
      <ul><li id="localTrustAdmin"></li><li id="localTrustTestSigning"></li><li id="localTrustSecureBoot"></li><li id="localTrustRestart"></li></ul>
    </section>
    <section id="secureBootGuide" class="notice secure-guide">
      <strong id="secureBootGuideTitle"></strong>
      <p id="secureBootWarning" class="secure-warning"></p>
      <ol><li id="secureBootStep1"></li><li id="secureBootStep2"></li><li id="secureBootStep3"></li><li id="secureBootStep4"></li><li id="secureBootStep5"></li></ol>
    </section>
    <section id="checks" class="panel"></section>
    <div id="message" class="message"></div>
    <div class="actions">
      <button id="install" class="primary"></button><button id="launch"></button>
      <button id="refresh"></button><button id="guide"></button>
      <button id="uninstall" class="danger"></button>
    </div>
    <details><summary id="infoTitle"></summary><div class="info-body"><p id="info"></p></div></details>
    <div id="version" class="version"></div>
  </main>
  <div id="confirmOverlay" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmMessage">
    <div class="confirm-card">
      <p id="confirmMessage" class="confirm-message"></p>
      <div class="confirm-actions"><button id="confirmCancel"></button><button id="confirmAccept" class="primary"></button></div>
    </div>
  </div>
  <script>
    const FALLBACK = {
      PlatformSetupTitleMac:"Codex Bridge Setup", PlatformSetupTitleWindows:"Codex Micro Windows Setup",
      PlatformSetupIntroMac:"Install, launch, and check the local Codex connection.", PlatformSetupIntroWindows:"Install and check the local virtual HID connection used by Codex Desktop.",
      ExperimentalActionTitle:"Experimental Windows action", ExperimentalActionDescription:"This action uses Windows UI Automation and may be affected by Codex Desktop updates, focus, or accessibility restrictions.",
      LocalTrustTitle:"Windows Local-Trust Mode", LocalTrustDescription:"The bundled virtual HID driver uses a project development certificate trusted only on this PC.",
      LocalTrustAdmin:"Installation opens a visible administrator PowerShell window.", LocalTrustTestSigning:"Windows Test Signing must be enabled.",
      LocalTrustSecureBoot:"Secure Boot may need to be disabled manually before installation can continue.", LocalTrustRestart:"Windows may require a restart; this page only reports when one is required.",
      SecureBootGuideTitle:"How to temporarily disable Secure Boot", SecureBootWarning:"Security notice: save your work and make sure your BitLocker recovery key is available before changing UEFI settings.",
      SecureBootStep1:"Windows 11: open Settings > System > Recovery. Windows 10: open Settings > Update & Security > Recovery.",
      SecureBootStep2:"Under Advanced startup, select Restart now.", SecureBootStep3:"Select Troubleshoot > Advanced options > UEFI Firmware Settings > Restart.",
      SecureBootStep4:"In UEFI/BIOS, find Secure Boot under Security, Boot, or Authentication; set it to Disabled, then Save & Exit. Names vary by PC manufacturer.",
      SecureBootStep5:"After Windows starts, return here and choose Install / Repair again. Keep Secure Boot disabled while using this local-trust driver.",
      SetupCheckPayload:"Installer payload", SetupCheckDriver:"Virtual HID driver", SetupCheckRuntime:"Virtual device runtime", SetupCheckCodex:"Codex connection",
      Ready:"Ready", NotReady:"Not ready", UpdateAvailable:"Update available", Checking:"Checking…", InstallRepair:"Install / Repair", ContinueInstallation:"Continue installation",
      StartRuntime:"Start runtime", LaunchBridge:"Launch Codex Bridge", CheckAgain:"Check again", InstallationGuide:"Installation guide", Uninstall:"Uninstall platform setup",
      Installing:"Installing…", Uninstalling:"Uninstalling…", PhaseReady:"Codex Micro is ready.", PhaseNotInstalled:"Install the required platform setup to continue.",
      PhaseNeedsRestart:"Restart Windows, then return here to continue installation.", PhaseSecureBootBlocked:"Disable Secure Boot manually, then run Install / Repair again.",
      PhaseUpdateAvailable:"A bundled setup update is available.", PhaseRuntimeOffline:"The local runtime is not running.", PhaseCodexOffline:"The setup is ready; open Codex Desktop to connect.",
      PhaseDriverError:"The virtual HID driver is not ready. Run Install / Repair.", PhasePayloadMissing:"The bundled Windows installer payload is missing or incomplete.",
      PhaseUnsupported:"This platform is not supported. Windows requires Windows 10 22H2 or Windows 11 x64.", PhaseNewerInstalled:"A newer setup is already installed. Automatic downgrade is blocked.", PlatformInfoMacTitle:"About Codex Bridge", PlatformInfoWindowsTitle:"About Windows setup",
      PlatformInfoMac:"Codex Bridge starts Codex Desktop with loopback-only CDP and runs a local background service.",
      PlatformInfoWindows:"A locally trusted virtual HID driver and a current-user scheduled task provide the Windows device connection. Uninstall leaves Test Signing unchanged.",
      ConfirmInstallMac:"Install or repair Codex Bridge for this user?", ConfirmInstallWindows:"Open an administrator PowerShell window to install or repair the local virtual HID driver?",
      ConfirmUninstall:"Remove the platform runtime, driver, scheduled task, and local certificate?", Confirm:"Confirm", Cancel:"Cancel", Version:"Installed {installed} · Bundled {bundled}", Failed:"Operation failed"
    };
    const query = new URLSearchParams(location.search);
    const rawLanguage = query.get("language") || "en-US";
    const locale = rawLanguage.startsWith("zh-HK") || rawLanguage.startsWith("zh-TW") ? "zh_HK" : rawLanguage.startsWith("zh") ? "zh_CN" : ({ja:"ja_JP",de:"de_DE",ko:"ko_KR",pt:"pt_PT",es:"es_ES"}[rawLanguage.split(/[-_]/)[0]] || "en");
    const connection = { address:query.get("address") || "127.0.0.1", port:query.get("port") || "3906", uuid:query.get("uuid") || "", actionid:query.get("actionid") || "", key:query.get("key") || "" };
    const action = connection.uuid.split(".").at(-1);
    let t = { ...FALLBACK };
    let socket;
    let latestStatus;
    let pollTimer;
    function text(id, value) { document.getElementById(id).textContent = value || ""; }
    function format(template, values) { return template.replace(/\{(\w+)\}/g, (_, key) => values[key] || "—"); }
    function send(actionName) { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ cmd:"sendToPlugin", uuid:connection.uuid, actionid:connection.actionid, key:connection.key, payload:{ type:"bridgeSetup", action:actionName } })); }
    function requestConfirmation(message) {
      const overlay = document.getElementById("confirmOverlay");
      text("confirmMessage", message); text("confirmAccept", t.Confirm); text("confirmCancel", t.Cancel);
      overlay.classList.add("visible");
      document.getElementById("confirmAccept").focus();
      return new Promise(resolve => {
        const finish = result => { overlay.classList.remove("visible"); accept.onclick = null; cancel.onclick = null; resolve(result); };
        const accept = document.getElementById("confirmAccept");
        const cancel = document.getElementById("confirmCancel");
        accept.onclick = () => finish(true); cancel.onclick = () => finish(false);
      });
    }
    function phaseText(phase) { return t[{"ready":"PhaseReady","not-installed":"PhaseNotInstalled","needs-restart":"PhaseNeedsRestart","secure-boot-blocked":"PhaseSecureBootBlocked","update-available":"PhaseUpdateAvailable","newer-installed":"PhaseNewerInstalled","runtime-offline":"PhaseRuntimeOffline","codex-offline":"PhaseCodexOffline","driver-error":"PhaseDriverError","payload-missing":"PhasePayloadMissing","unsupported":"PhaseUnsupported"}[phase]] || t.Checking; }
    function checkLabel(id) { return t[{payload:"SetupCheckPayload",driver:"SetupCheckDriver",runtime:"SetupCheckRuntime",codex:"SetupCheckCodex"}[id]] || id; }
    function render(status, payload = {}) {
      latestStatus = status;
      const windows = status.platform === "windows";
      text("title", t[windows ? "PlatformSetupTitleWindows" : "PlatformSetupTitleMac"]);
      text("intro", t[windows ? "PlatformSetupIntroWindows" : "PlatformSetupIntroMac"]);
      document.getElementById("localTrust").style.display = windows ? "block" : "none";
      document.getElementById("secureBootGuide").style.display = status.phase === "secure-boot-blocked" ? "block" : "none";
      document.getElementById("experimental").style.display = status.actions?.[action]?.experimental ? "block" : "none";
      const checks = document.getElementById("checks");
      checks.replaceChildren(...status.checks.map(check => {
        const row = document.createElement("div"); row.className = "row";
        const label = document.createElement("span"); label.textContent = checkLabel(check.id);
        const value = document.createElement("span"); value.className = `value ${check.ready ? "good" : check.level === "warn" ? "warn" : "bad"}`;
        const dot = document.createElement("i"); dot.className = "dot";
        const state = document.createElement("span"); state.textContent = check.level === "warn" ? t.UpdateAvailable : check.ready ? t.Ready : t.NotReady;
        value.append(dot, state); row.append(label, value); return row;
      }));
      const busy = Boolean(payload.busy);
      text("install", busy && payload.operation === "install" ? t.Installing : status.phase === "needs-restart" || status.phase === "secure-boot-blocked" ? t.ContinueInstallation : t.InstallRepair);
      text("launch", windows ? t.StartRuntime : t.LaunchBridge);
      text("refresh", t.CheckAgain); text("guide", t.InstallationGuide); text("uninstall", busy && payload.operation === "uninstall" ? t.Uninstalling : t.Uninstall);
      document.getElementById("install").disabled = busy || !status.setup.canInstall;
      document.getElementById("launch").disabled = busy || !status.setup.canLaunch;
      document.getElementById("refresh").disabled = busy;
      document.getElementById("uninstall").disabled = busy || !status.setup.canUninstall;
      const message = document.getElementById("message");
      text("message", payload.error ? `${t.Failed}: ${payload.error}` : phaseText(status.phase));
      message.className = `message ${payload.error ? "error" : status.ready ? "success" : ""}`;
      text("infoTitle", t[windows ? "PlatformInfoWindowsTitle" : "PlatformInfoMacTitle"]);
      text("info", t[windows ? "PlatformInfoWindows" : "PlatformInfoMac"]);
      text("version", format(t.Version, { installed:status.setup.installedVersion, bundled:status.setup.bundledVersion }));
    }
    async function loadLocalization() { try { const response = await fetch(`../${locale}.json`); t = { ...t, ...(await response.json()).Localization }; } catch {} }
    function connect() {
      socket = new WebSocket(`ws://${connection.address}:${connection.port}`);
      socket.addEventListener("open", () => { socket.send(JSON.stringify({ code:0, cmd:"connected", uuid:connection.uuid })); send("status"); clearInterval(pollTimer); pollTimer = setInterval(() => send("status"), 2000); });
      socket.addEventListener("message", event => { const message = JSON.parse(event.data); if (message.cmd === "sendToPropertyInspector" && message.payload?.type === "bridgeSetupStatus") render(message.payload.status, message.payload); });
      socket.addEventListener("close", () => { clearInterval(pollTimer); setTimeout(connect, 1000); });
    }
    async function start() {
      await loadLocalization();
      for (const id of ["experimentalTitle","experimentalDescription","localTrustTitle","localTrustDescription","localTrustAdmin","localTrustTestSigning","localTrustSecureBoot","localTrustRestart","secureBootGuideTitle","secureBootWarning","secureBootStep1","secureBootStep2","secureBootStep3","secureBootStep4","secureBootStep5"]) text(id, t[id[0].toUpperCase() + id.slice(1)]);
      text("title", t.PlatformSetupTitleMac); text("intro", t.PlatformSetupIntroMac); text("message", t.Checking);
      document.getElementById("install").addEventListener("click", async () => { const windows = latestStatus?.platform === "windows"; if (await requestConfirmation(t[windows ? "ConfirmInstallWindows" : "ConfirmInstallMac"])) send("install"); });
      document.getElementById("launch").addEventListener("click", () => send("launch"));
      document.getElementById("refresh").addEventListener("click", () => send("status"));
      document.getElementById("guide").addEventListener("click", () => send("openGuide"));
      document.getElementById("uninstall").addEventListener("click", async () => { if (await requestConfirmation(t.ConfirmUninstall)) send("uninstall"); });
      connect();
    }
    void start();
  </script>
</body>
</html>
