<!doctype html>
<html data-action="com.ulanzi.ulanzistudio.antigravity.task1" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Bridge Setup</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { margin: 0; background: transparent; color: #e8e8e8; font-size: 13px; }
    * { box-sizing: border-box; }
    main { padding: 12px 14px 10px; }
    h1 { margin: 0 0 5px; font-size: 15px; font-weight: 650; }
    .intro { margin: 0 0 10px; color: #aeb3ba; line-height: 1.35; }
    .panel { border: 1px solid rgba(255,255,255,.12); border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.035); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; min-height: 37px; padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .row:last-child { border-bottom: 0; }
    .value { display: inline-flex; align-items: center; gap: 6px; color: #aeb3ba; text-align: right; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #72777f; box-shadow: 0 0 0 2px rgba(114,119,127,.15); }
    .value.good { color: #75d6a3; }
    .value.good .dot { background: #42c985; box-shadow: 0 0 0 2px rgba(66,201,133,.15); }
    .value.warn { color: #f0bc68; }
    .value.warn .dot { background: #e6a84b; box-shadow: 0 0 0 2px rgba(230,168,75,.15); }
    .value.bad { color: #ef8585; }
    .value.bad .dot { background: #e45f5f; box-shadow: 0 0 0 2px rgba(228,95,95,.15); }
    .message { min-height: 18px; margin: 8px 1px 4px; color: #aeb3ba; line-height: 1.35; }
    .message.error { color: #ef8585; }
    .message.success { color: #75d6a3; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    button { min-height: 33px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; color: #f3f3f3; background: rgba(255,255,255,.08); cursor: pointer; }
    button:hover:not(:disabled) { background: rgba(255,255,255,.13); }
    button.primary { border-color: #6366f1; background: #4f46e5; }
    button.primary:hover:not(:disabled) { background: #5b54f6; }
    button:disabled { cursor: default; opacity: .45; }
    .version { margin-top: 7px; color: #777e87; font-size: 11px; text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Antigravity Deck Setup</h1>
    <p id="intro" class="intro">Connects Ulanzi Studio directly to your local Antigravity AI Agent sessions.</p>
    <section class="panel">
      <div class="row"><span>Bridge Service (127.0.0.1:17374)</span><span id="serviceValue" class="value"><i class="dot"></i><span id="serviceText">Checking...</span></span></div>
      <div class="row"><span>Antigravity Desktop</span><span id="desktopValue" class="value"><i class="dot"></i><span id="desktopText">Checking...</span></span></div>
      <div class="row"><span>Active Agent Sessions</span><span id="sessionsValue" class="value"><i class="dot"></i><span id="sessionsText">0</span></span></div>
      <div class="row"><span>Pending Attention / Feedback</span><span id="feedbackValue" class="value"><i class="dot"></i><span id="feedbackText">None</span></span></div>
    </section>
    <div id="message" class="message"></div>
    <div class="actions">
      <button id="refreshBtn" class="primary" onclick="checkStatus()">Refresh Status</button>
      <button id="focusBtn" onclick="focusEditor()">Focus Antigravity</button>
    </div>
    <div class="version">Antigravity Deck v0.4.1</div>
  </main>
  <script src="inspector-api.js"></script>
  <script>
    async function checkStatus() {
      const msg = document.getElementById("message");
      const serviceValue = document.getElementById("serviceValue");
      const serviceText = document.getElementById("serviceText");
      const sessionsValue = document.getElementById("sessionsValue");
      const sessionsText = document.getElementById("sessionsText");
      const feedbackValue = document.getElementById("feedbackValue");
      const feedbackText = document.getElementById("feedbackText");
      const desktopValue = document.getElementById("desktopValue");
      const desktopText = document.getElementById("desktopText");

      try {
        const res = await localFetch("http://127.0.0.1:17374/state");
        if (res.ok) {
          const data = await res.json();
          serviceValue.className = "value good";
          serviceText.textContent = "Running";
          desktopValue.className = "value " + (data.applicationConnected ? "good" : "warn");
          desktopText.textContent = data.applicationConnected ? "Connected" : "Unavailable";
          
          sessionsValue.className = "value good";
          sessionsText.textContent = String(data.activeTasks?.length || 0);

          if (data.pendingAttentionCount > 0) {
            feedbackValue.className = "value warn";
            feedbackText.textContent = data.pendingAttentionCount + " Pending";
          } else {
            feedbackValue.className = "value good";
            feedbackText.textContent = "Ready";
          }
          msg.className = "message " + (data.applicationConnected ? "success" : "error");
          msg.textContent = data.applicationConnected
            ? (data.lastTask?.title ? "Selected task: " + data.lastTask.title : "Desktop connected. Select a task to use task controls.")
            : (data.desktopError || "Start Antigravity Desktop to use task controls. Saved history remains available.");
        } else {
          throw new Error("Bridge returned " + res.status);
        }
      } catch (e) {
        serviceValue.className = "value bad";
        serviceText.textContent = "Offline";
        desktopValue.className = "value";
        desktopText.textContent = "-";
        sessionsValue.className = "value";
        sessionsText.textContent = "-";
        feedbackValue.className = "value";
        feedbackText.textContent = "-";
        msg.className = "message error";
        msg.textContent = "Antigravity bridge is offline (127.0.0.1:17374).";
      }
    }

    async function focusEditor() {
      try {
        const response = await localFetch("http://127.0.0.1:17374/focus", { method: "POST" });
        if (!response.ok) throw new Error("Could not focus the editor (" + response.status + ").");
      } catch (e) {
        const msg = document.getElementById("message");
        msg.className = "message error";
        msg.textContent = e.message;
      }
    }

    checkStatus();
  </script>
</body>
</html>
